<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b5d4b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Камбуз" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css?v=1.2.6" />
  <title>Камбуз</title>
</head>
<body>
  <div id="app"><div style="padding:calc(env(safe-area-inset-top) + 24px) 24px;font-family:system-ui;color:#18322c"><b>Камбуз <span class="app-version" style="font-size:12px;color:#58736b">v2.2.2</span></b><p>Загружаю локальные данные…</p></div></div>
  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="version-addon.js?v=2.2.2"></script>
  <script src="config.js?v=1.2.4"></script>
  <script src="auth-addon.js?v=2.1.1"></script>
  <script src="merge-tombstone-addon.js?v=2.0.2"></script>
  <script src="local-ops-sanitizer.js?v=1.9.1"></script>
  <script src="classification-addon.js?v=1.8.0"></script>
  <script src="sync-resilience-addon.js?v=1.2.2"></script>
  <script src="app.js?v=1.2.7"></script>
  <script>
  (()=>{
    const read=(k,f=[])=>{try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}};
    const dateKey=v=>{const d=v?new Date(v):new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
    const money=n=>Number(n||0).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₽';
    function applyTodayCost(){
      const today=dateKey();
      const deleted=new Set(read('kambuz_pending_ops',[]).filter(x=>x?.kind==='operation_delete').map(x=>x.operation_id));
      const total=read('kambuz_ops',[]).filter(o=>o&&!deleted.has(o.id)&&['consumption','writeoff'].includes(o.type)&&dateKey(o.created_at)===today).reduce((s,o)=>s+Number(o.cost_total_rub||0),0);
      const next=money(total);
      document.querySelectorAll('.card.stat').forEach(card=>{
        if(card.querySelector('span')?.textContent.trim()!=='Расход сегодня')return;
        const value=card.querySelector('strong');
        if(value&&value.textContent!==next)value.textContent=next;
      });
    }
    let queued=false;
    const root=document.getElementById('app');
    new MutationObserver(()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;applyTodayCost()})}).observe(root,{childList:true,subtree:true});
    applyTodayCost();
    document.addEventListener('kambuz-operation-deleted',applyTodayCost);
  })();
  </script>
  <script src="offline-receipt-addon.js?v=1.3.2"></script>
  <script src="inventory-addon.js?v=1.4.0"></script>
  <script src="duplicate-cleanup-addon.js?v=1.5.0"></script>
  <script src="bulk-writeoff-addon.js?v=1.6.0"></script>
  <script src="imo-report-addon.js?v=1.8.0"></script>
  <script src="item-card-addon.js?v=1.9.6"></script>
  <script src="average-consumption-addon.js?v=1.9.6"></script>
  <script src="food-cost-addon.js?v=2.2.0"></script>
  <script src="sync-queue-ui-addon.js?v=1.2.4"></script>
</body>
</html>
